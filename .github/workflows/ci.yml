name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install Dependencies
        run: bun ci

      - name: Verify
        run: bun run verify:ci

      - name: Build Release Archive
        run: bun run archive:release
